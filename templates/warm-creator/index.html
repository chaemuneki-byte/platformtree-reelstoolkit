<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1a1210; }
      #root { position: absolute; inset: 0; overflow: hidden; }
      .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 50% 30%; }
      .cam video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #cam-a { z-index: 1; }
      #behind { z-index: 2; }
      #cam-b { z-index: 3; }
      #front { z-index: 4; }
      #captions { z-index: 5; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-xc1j" id="root" data-composition-id="main" data-start="0" data-duration="18.6" data-width="1080" data-height="1920">
      <div data-hf-id="hf-e0xm" id="cam-a" class="cam">
        <video data-hf-id="hf-4v5u" id="aroll" class="clip" src="assets/aroll.mp4" data-start="0" data-duration="18.6" data-track-index="0" data-has-audio="true" data-volume="1" playsinline></video>
      </div>

      <!-- titles and UI cards that sit behind the head -->
      <div data-hf-id="hf-2ae2" id="behind" data-composition-id="behind" data-composition-src="compositions/behind.html" data-start="0" data-duration="18.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div data-hf-id="hf-a2tl" id="cam-b" class="cam">
        <video data-hf-id="hf-7rye" id="person" class="clip" src="assets/person.webm" data-start="0" data-duration="18.6" data-track-index="2" muted playsinline data-layout-allow-occlusion=""></video>
      </div>

      <!-- the quote: 조회수가 아니라 / 구조에서 나옵니다 -->
      <div data-hf-id="hf-2ya3" id="front" data-composition-id="front" data-composition-src="compositions/front.html" data-start="5.3" data-duration="1.73" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div data-hf-id="hf-c5oc" id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="18.6" data-track-index="4" data-track-kind="captions" data-width="1080" data-height="1920"></div>

      <!-- sound: a steady bed, three soft pops when a card arrives -->
      <audio data-hf-id="hf-avey" id="bgm" class="clip" src="assets/audio/bgm.mp3" data-start="0" data-duration="18.6" data-track-index="5" data-volume="0.15" data-fade-in="0.3" data-fade-out="0.9"></audio>
      <audio data-hf-id="hf-vmm1" id="pop-stats" class="clip" src="assets/audio/pop.wav" data-start="2.12" data-duration="0.3" data-track-index="6" data-volume="0.28"></audio>
      <audio data-hf-id="hf-c76b" id="pop-flow" class="clip" src="assets/audio/pop.wav" data-start="7.03" data-duration="0.3" data-track-index="6" data-volume="0.28"></audio>
      <audio data-hf-id="hf-u5og" id="pop-cta" class="clip" src="assets/audio/pop.wav" data-start="14.19" data-duration="0.3" data-track-index="6" data-volume="0.28"></audio>
    </div>
    <script>
      // Camera: two clean hard cuts (big enough to read as intended) and three slow pushes.
      // Framing A (1.15, y86) keeps the head under the top graphics; B (1.45) is the tight emphasis shot.
      const tl = gsap.timeline({ paused: true });
      const cam = ["#cam-a", "#cam-b"];
      const cut = (t, scale, y = 0) => tl.set(cam, { scale, y }, t);
      const push = (t, scale, y, dur) => tl.to(cam, { scale, y, duration: dur, ease: "power2.inOut" }, t);
      cut(0, 1.15, 86);            // title → graph, one framing
      cut(3.519, 1.45, 0);         // 이거 꼭 아셔야 합니다 — tight (+26%)
      cut(4.702, 1.0, 0);          // 블로그 수익은 — wide (-31%)
      push(7.027, 1.15, 86, 0.5);  // the diagram arrives as the camera settles
      push(11.919, 1.22, 126, 0.6);// 연결돼야 — lean in
      push(17.592, 1.3, 172, 0.7); // 템플릿 — final lean in
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
