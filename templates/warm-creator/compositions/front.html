<template>
  <style>
    /*FONTS*/
    #root { position: absolute; inset: 0; }
    .q { position: absolute; white-space: nowrap; color: #fff; letter-spacing: -0.05em;
      text-shadow: 0 2px 4px rgba(30, 16, 10, 0.5), 0 6px 18px rgba(30, 16, 10, 0.45); }
    #q-top { left: 0; width: 1080px; text-align: center; top: 186px; font: 900 82px/1 "Pretendard"; }
    #q-top b { position: relative; display: inline-block; font-weight: 900; }
    #q-bot { left: 0; width: 1080px; text-align: center; top: 980px; font: 900 112px/1 "Pretendard"; }
    #q-bot b { position: relative; display: inline-block; color: #ffd23f; font-weight: 900; }
    .mark { position: absolute; overflow: visible; pointer-events: none; }
    .mark path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    #m-strike { left: -10px; top: 14px; width: calc(100% + 20px); height: 56px; }
    #m-strike path { stroke: #ff4b3e; stroke-width: 9; }
    #m-circle { left: -34px; top: -26px; width: calc(100% + 68px); height: 166px; }
    #m-circle path { stroke: #ffd23f; stroke-width: 7; }
  </style>
  <div id="root" data-composition-id="front" data-width="1080" data-height="1920">
    <div id="q-top" class="q clip" data-start="0.124" data-duration="1.606" data-track-index="0" data-layout-allow-overlap
      ><b>조회수<svg id="m-strike" class="mark"><path id="p-strike"/></svg></b>가 아니라</div>
    <div id="q-bot" class="q clip" data-start="0.886" data-duration="0.844" data-track-index="1" data-layout-allow-overlap
      ><b>구조<svg id="m-circle" class="mark"><path id="p-circle"/></svg></b>에서 나옵니다</div>
  </div>
  <script>
    // local time: 0 = 5.3 s. Hand-drawn marks (seeded wobble, as in the registry's hw-underline / hw-callout-circle).
    const hash = (n, seed) => { const x = Math.sin(n * 127.1 + seed * 311.7) * 43758.5453; return (x - Math.floor(x)) * 2 - 1; };
    const box = (id) => { const e = document.getElementById(id); return [e.getBoundingClientRect().width || e.parentNode.offsetWidth + 20, e.parentNode.offsetHeight]; };
    // double-pass strike across 조회수
    (() => {
      const el = document.getElementById("m-strike"); const w = el.parentNode.offsetWidth + 20, m = 28, s = 6, wb = (n, r) => hash(n, s) * r;
      el.setAttribute("viewBox", `0 0 ${w} 56`);
      document.getElementById("p-strike").setAttribute("d",
        `M ${4 + wb(1, 3)} ${m + wb(2, 4)} L ${w - 6 + wb(3, 3)} ${m - 6 + wb(4, 4)} M ${w - 14 + wb(5, 4)} ${m + 8 + wb(6, 4)} L ${10 + wb(7, 4)} ${m + 2 + wb(8, 4)}`);
    })();
    // loose loop around 구조
    (() => {
      const el = document.getElementById("m-circle"); const w = el.parentNode.offsetWidth + 68, h = 166, s = 9, wb = (n, r) => hash(n, s) * r;
      el.setAttribute("viewBox", `0 0 ${w} ${h}`);
      const cx = w / 2, cy = h / 2, rx = w / 2 - 8, ry = h / 2 - 10; let d = "";
      for (let i = 0; i <= 26; i++) {
        const a = -Math.PI * 0.62 + (i / 24) * Math.PI * 2.08;
        const x = cx + Math.cos(a) * (rx + wb(i, 7)), y = cy + Math.sin(a) * (ry + wb(i + 40, 5));
        d += (i ? " L " : "M ") + x.toFixed(1) + " " + y.toFixed(1);
      }
      document.getElementById("p-circle").setAttribute("d", d);
    })();

    const tl = gsap.timeline({ paused: true });
    const draw = (sel, t, dur) => { const p = document.querySelector(sel); const len = p.getTotalLength();
      tl.fromTo(p, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut", immediateRender: true }, t); };

    tl.fromTo("#q-top", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.24, ease: "expo.out" }, 0.124);
    draw("#p-strike", 0.585, 0.28);                       // 아니라 (5.885 s)
    tl.fromTo("#q-bot", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.24, ease: "back.out(1.6)" }, 0.886);
    draw("#p-circle", 0.98, 0.38);
    tl.to(["#q-top", "#q-bot"], { opacity: 0, duration: 0.12, ease: "power2.in" }, 1.52);
    window.__timelines["front"] = tl;
  </script>
</template>
