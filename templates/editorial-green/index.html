<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --green: #1f3d2b;
        --cream: #f1ebdd;
        --gold: #d9c27a;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0e1a13; }
      #root { position: absolute; inset: 0; overflow: hidden; }
      .cam {
        position: absolute; left: 0; top: 0; width: 1080px; height: 1920px;
        transform-origin: 50% 30%;
      }
      .cam video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #cam-a { z-index: 1; }
      #behind { z-index: 2; }
      #cam-b { z-index: 3; }
      #hook, #structure, #payoff { z-index: 4; }
      #captions { z-index: 5; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-xc1j" id="root" data-composition-id="main" data-start="0" data-duration="18.6" data-width="1080" data-height="1920">
      <!-- A-roll: the take as shot (graded) -->
      <div data-hf-id="hf-e0xm" id="cam-a" class="cam">
        <video data-hf-id="hf-4v5u" id="aroll" class="clip" src="assets/aroll.mp4" data-start="0" data-duration="18.6" data-track-index="0" data-has-audio="true" data-volume="1" playsinline></video>
      </div>

      <!-- green world + giant serif words that sit behind the head -->
      <div data-hf-id="hf-2ae2" id="behind" data-composition-id="behind" data-composition-src="compositions/behind.html" data-start="0" data-duration="18.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!-- the person cut out, on top of the behind-the-head words -->
      <div data-hf-id="hf-a2tl" id="cam-b" class="cam">
        <video data-hf-id="hf-7rye" id="person" class="clip" src="assets/person.webm" data-start="0" data-duration="18.6" data-track-index="2" muted playsinline data-layout-allow-occlusion=""></video>
      </div>

      <div data-hf-id="hf-nq28" id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="7.03" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div data-hf-id="hf-s5jv" id="structure" data-composition-id="structure" data-composition-src="compositions/structure.html" data-start="7.03" data-duration="5.51" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div data-hf-id="hf-eh04" id="payoff" data-composition-id="payoff" data-composition-src="compositions/payoff.html" data-start="12.54" data-duration="6.06" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div data-hf-id="hf-c5oc" id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="18.6" data-track-index="4" data-track-kind="captions" data-width="1080" data-height="1920"></div>

      <!-- sound: a quiet bed and three accents only -->
      <audio data-hf-id="hf-fzpv" id="bgm" class="clip" src="assets/audio/bgm.mp3" data-start="0" data-duration="18.6" data-track-index="5" data-volume="0.11" data-fade-in="0.4" data-fade-out="0.9"></audio>
      <audio data-hf-id="hf-xdvh" id="hit-green" class="clip" src="assets/audio/hit.wav" data-start="1.79" data-duration="2.6" data-track-index="6" data-volume="0.2" data-fade-out="0.8"></audio>
      <audio data-hf-id="hf-iwhg" id="hit-sales" class="clip" src="assets/audio/hit.wav" data-start="12.69" data-duration="2.6" data-track-index="6" data-volume="0.16" data-fade-out="0.8"></audio>
      <audio data-hf-id="hf-9vm7" id="ping-sent" class="clip" src="assets/audio/ping.wav" data-start="15.31" data-duration="1.2" data-track-index="7" data-volume="0.12"></audio>
    </div>
    <script>
      // Camera: A-roll and cutout always move together (cuts on phrases, short punch-ins on key words).
      const tl = gsap.timeline({ paused: true });
      const cam = ["#cam-a", "#cam-b"];
      const cut = (t, scale, y = 0) => tl.set(cam, { scale, y }, t);
      const punch = (t, scale, y = 0) => tl.to(cam, { scale, y, duration: 0.28, ease: "power3.out" }, t);

      cut(0, 1.06);
      punch(0.73, 1.12);              // 조회수 — giant word arrives behind the head
      cut(2.116, 1.35, 200);          // 매출이 — the green world, tight
      punch(3.48, 1.45, 200);         // 이거 꼭
      cut(4.702, 1.0);                // 블로그 수익은 — back to the room, wide
      cut(7.027, 1.06);               // the three steps
      punch(8.72, 1.12);
      cut(10.957, 1.0);               // 이 세 가지가
      punch(11.88, 1.06);             // 연결돼야
      cut(12.54, 1.0);                // 조회수가 → 매출로 (behind the head)
      cut(14.184, 1.08);              // CTA
      punch(16.1, 1.14);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
